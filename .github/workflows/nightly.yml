name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzSanitize, FuzzOffsets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./aisanitizer -run '^$' -fuzz "^${{ matrix.target }}$" -fuzztime 5m
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: aisanitizer/testdata/fuzz

  unicode-tables:
    # Fails when the committed tables differ from a fresh generation
    # (e.g. after bumping the Unicode version in tables.go).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go generate ./aisanitizer
      - run: git diff --exit-code
