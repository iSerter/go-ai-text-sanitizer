name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./aisanitizer -run '^$' -fuzz '^FuzzSanitize$' -fuzztime 30s
      - run: go test ./aisanitizer -run '^$' -fuzz '^FuzzOffsets$' -fuzztime 30s

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare benchmarks with the base branch (informational)
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          go test ./aisanitizer -run '^$' -bench . -count 6 > new.txt
          git checkout -q "${{ github.event.pull_request.base.sha }}"
          go test ./aisanitizer -run '^$' -bench . -count 6 > old.txt || true
          git checkout -q -
          benchstat old.txt new.txt | tee -a "$GITHUB_STEP_SUMMARY"
